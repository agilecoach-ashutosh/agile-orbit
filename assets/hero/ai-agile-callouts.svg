  <path d="M622 620 a28 28 0 1 1 56 0" stroke="#ffe1a0" stroke-width="6"/>
  <path d="M678 620 a28 28 0 1 1 -56 0" stroke="#ffe1a0" stroke-width="6"/>
  <path d="M676 592 l13 2 -5 12" fill="#ffe1a0" stroke="none"/>
  <path d="M624 648 l-13 -2 5 -12" fill="#ffe1a0" stroke="none"/>
  <text x="650" y="630" fill="#fff0cb" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" text-anchor="middle">AGILE</text>
</g>
</svg>