<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="AI and Agile glowing callout orbs connected by orbital trails">
<defs>
  <radialGradient id="blueOrb"><stop offset="0" stop-color="#dff8ff"/><stop offset=".25" stop-color="#5fc8ff" stop-opacity=".95"/><stop offset=".7" stop-color="#1375d8" stop-opacity=".34"/><stop offset="1" stop-color="#00142d" stop-opacity="0"/></radialGradient>
  <radialGradient id="goldOrb"><stop offset="0" stop-color="#fff7df"/><stop offset=".25" stop-color="#ffd477" stop-opacity=".96"/><stop offset=".7" stop-color="#e58b19" stop-opacity=".35"/><stop offset="1" stop-color="#351600" stop-opacity="0"/></radialGradient>
  <filter id="glowBlue"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowGold"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
