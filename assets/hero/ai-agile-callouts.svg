  <path d="M90 730 C275 835 555 760 710 610 C860 468 860 315 760 225" stroke="#ffbd54" stroke-opacity=".92" stroke-width="4" filter="url(#glowGold)"/>
  <path d="M94 720 C280 820 565 760 707 620" stroke="#9cdbff" stroke-opacity=".55" stroke-width="1.5"/>
</g>
<g filter="url(#glowBlue)">
  <circle cx="675" cy="170" r="74" fill="#061a31" fill-opacity=".78" stroke="#65ccff" stroke-width="3"/>
  <circle cx="675" cy="170" r="93" fill="url(#blueOrb)" opacity=".22"/>
  <circle cx="675" cy="170" r="52" fill="none" stroke="#4bbdff" stroke-opacity=".22"/>
  <text x="675" y="186" fill="#78d4ff" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800" text-anchor="middle">AI</text>
</g>
<g filter="url(#glowGold)">
  <circle cx="650" cy="620" r="74" fill="#251508" fill-opacity=".8" stroke="#ffc968" stroke-width="3"/>
  <circle cx="650" cy="620" r="94" fill="url(#goldOrb)" opacity=".2"/>
