<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Prompt Library | Agile Orbit</title><meta name="description" content="Copy-ready prompts."><meta name="theme-color" content="#071019"><link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/animations.css"><link rel="stylesheet" href="../../css/responsive.css"><link rel="stylesheet" href="../../css/universe-pages.css"><link rel="stylesheet" href="../css/reference-nav.css"></head><body class="universe-inner"><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="./">Home</a><span>/</span><span>Resources</span></div><span class="eyebrow">AGILE ORBIT</span><h1>AI Prompt Library</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Copy-ready prompts for Agile practitioners.</p></div></section><section class="section"><div class="container"><div class="grid-3" id="promptGrid"></div></div></section></main><div id="site-footer"></div><script src="../../js/config.js"></script><script src="../../js/utilities.js"></script><script src="../../js/navigation.js"></script><script src="../../js/main.js"></script><script src="../../js/tools.js"></script><script>const prompts=[{t:"Retro synthesis",c:"Retrospectives",p:"Act as a neutral retrospective facilitator. Cluster these anonymous observations into themes, identify tensions, and propose 3 questions that help the team explore causes without blaming people."},{t:"Story refinement",c:"Product",p:"Review this user story for clarity, user value, acceptance criteria, ambiguity and hidden assumptions. Ask the minimum questions needed before implementation."},{t:"Coaching reflection",c:"Agile Coach",p:"Act as a reflective coaching partner. Help me inspect what I observed, what I assumed, what impact I had, and what experiment I could try next."},{t:"Leadership lens",c:"Leadership",p:"Help me analyse this leadership situation through systems thinking. Identify incentives, information gaps, decision rights, feedback loops and unintended consequences."}];document.addEventListener("DOMContentLoaded",()=>{const g=document.getElementById("promptGrid");g.innerHTML=prompts.map((x,i)=>`<div class="card"><span class="tag">${x.c}</span><h3>${x.t}</h3><p>${x.p}</p><button class="btn btn-secondary" data-copy="${i}">Copy prompt</button></div>`).join("");g.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(prompts[Number(b.dataset.copy)].p);b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy prompt",1500)})});</script><script src="../../js/universe-pages.js"></script></body></html>
