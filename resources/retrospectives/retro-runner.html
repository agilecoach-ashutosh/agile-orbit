<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anonymous Retro Runner | Agile Orbit</title><meta name="description" content="Single-device anonymous retrospective runner."><meta name="theme-color" content="#071019"><link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/animations.css"><link rel="stylesheet" href="../../css/responsive.css"><link rel="stylesheet" href="../../css/universe-pages.css"></head><body><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../../">Home</a><span>/</span><a href="../">Resources</a><span>/</span><span>Retrospectives</span></div><span class="eyebrow">FACILITATOR MODE</span><h1>Anonymous Retro Runner</h1><p class="muted">A single-device anonymous retro. No responses are uploaded to a server; data stays in this browser.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><div class="field"><label>Retro format</label><select id="retroType"><option>Start / Stop / Continue</option><option>Mad / Sad / Glad</option><option>4Ls</option><option>Sailboat</option></select></div><div class="field" style="margin-top:14px"><label>Category</label><select id="retroCat"></select></div><div class="field" style="margin-top:14px"><label>Anonymous response</label><textarea id="retroResponse" rows="5" placeholder="Type a thought..."></textarea></div><div class="actions"><button class="btn btn-primary" id="addResponse">Add response</button><button class="btn btn-secondary" id="clearResponses">Clear</button></div></div><div class="panel"><span class="eyebrow">RESPONSES</span><div id="responses"></div><div class="actions"><button class="btn btn-secondary" id="exportRetro">Export CSV</button><button class="btn btn-secondary" data-print>Print</button></div></div></div></div></section></main><div id="site-footer"></div><script src="../../js/config.js"></script><script src="../../js/utilities.js"></script><script src="../../js/navigation.js"></script><script src="../../js/main.js"></script><script src="../../js/tools.js"></script><script src="../../js/retrospectives.js"></script><script>const sets={"Start / Stop / Continue":["Start","Stop","Continue"],"Mad / Sad / Glad":["Mad","Sad","Glad"],"4Ls":["Loved","Learned","Lacked","Longed for"],"Sailboat":["Wind","Anchors","Rocks","Destination"]};let rs=JSON.parse(localStorage.getItem("ao-retro")||"[]");const type=document.getElementById("retroType"),cat=document.getElementById("retroCat");function cats(){cat.innerHTML=sets[type.value].map(x=>`<option>${x}</option>`).join("")}function render(){document.getElementById("responses").innerHTML=rs.length?rs.map((r,i)=>`<div class="card" style="margin:9px 0"><span class="tag">${r.cat}</span><p>${r.text.replace(/[<>]/g,"")}</p><button class="btn btn-secondary" data-del="${i}">Delete</button></div>`).join(""):"<p class='muted'>No responses yet.</p>";document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{rs.splice(Number(b.dataset.del),1);save()})}function save(){localStorage.setItem("ao-retro",JSON.stringify(rs));render()}type.onchange=cats;document.getElementById("addResponse").onclick=()=>{const text=document.getElementById("retroResponse").value.trim();if(!text){AO.toast("Enter a response first.");return}rs.push({cat:cat.value,text});document.getElementById("retroResponse").value="";save()};document.getElementById("clearResponses").onclick=()=>{if(confirm("Clear all responses?")){rs=[];save()}};document.getElementById("exportRetro").onclick=()=>{let csv="Category,Response,Votes\n";rs.forEach(r=>csv+=`"${r.cat.replaceAll('"','""')}","${r.text.replaceAll('"','""')}",0\n`);AO.download("retro-responses.csv",csv,"text/csv")};cats();render();</script><script src="../../js/universe-pages.js"></script></body></html>
