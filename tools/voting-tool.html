<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Tool | Agile Orbit</title><meta name="description" content="Local facilitator-mode voting for one device."><meta name="theme-color" content="#071019"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/universe-pages.css"></head><body><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../">Home</a><span>/</span><span>Tools</span></div><span class="eyebrow">TOOL</span><h1>Voting Tool</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Local facilitator-mode voting for one device.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><div class="form-grid"><div class="field full"><label>Options (one per line)</label><textarea id="options" rows="6">Option A
Option B
Option C</textarea></div><div class="field"><label>Voting mode</label><select id="mode"><option>Dot Voting</option><option>Yes / No / Maybe</option><option>Confidence 1–5</option></select></div></div><div class="actions"><button class="btn btn-primary" id="startVote">Start / Reset Vote</button></div><div id="voteArea" style="margin-top:18px"></div></div><div class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Transparent by design.</h2><p class="muted">Inputs stay in this browser. No account or server is required.</p><div id="toolHelp" class="callout">Use realistic inputs and treat the result as a decision aid, not a promise.</div></div></div></div></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/utilities.js"></script><script src="../js/navigation.js"></script><script src="../js/main.js"></script><script src="../js/tools.js"></script><script src="../js/calculators.js"></script><script>let voteState={};function renderVote(){const opts=document.getElementById("options").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);voteState={};const area=document.getElementById("voteArea");area.innerHTML=opts.map((o,i)=>`<div class="card" style="margin:10px 0"><strong>${o}</strong><div class="actions"><button class="btn btn-secondary" data-vote="${i}">Vote +1</button><span class="tag" id="vc${i}">0 votes</span></div></div>`).join("");area.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.vote);voteState[i]=(voteState[i]||0)+1;document.getElementById("vc"+i).textContent=voteState[i]+" votes"})}document.getElementById("startVote").onclick=renderVote;renderVote();</script><script src="../js/universe-pages.js"></script></body></html>
