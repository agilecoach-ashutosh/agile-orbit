<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprint Capacity | Agile Orbit</title><meta name="description" content="Estimate a team Sprint capacity."><meta name="theme-color" content="#071019"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/universe-pages.css"></head><body><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../">Home</a><span>/</span><span>Tools</span></div><span class="eyebrow">TOOL</span><h1>Sprint Capacity</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Estimate a team Sprint capacity.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><form id="simpleForm"><div class="form-grid"><div class="field"><label>Team members</label><input id="team" type="number" min="0" step="0.1" value="5"></div><div class="field"><label>Sprint working days</label><input id="days" type="number" min="0" step="0.1" value="10"></div><div class="field"><label>Hours/day</label><input id="hours" type="number" min="0" step="0.1" value="6"></div><div class="field"><label>Focus factor %</label><input id="focus" type="number" min="0" step="0.1" value="80"></div></div><div class="actions"><button class="btn btn-primary">Calculate</button><button type="button" class="btn btn-secondary" data-print>Print</button></div><div class="result" style="margin-top:18px"><small>Result</small><strong id="result">0</strong><p id="explain" class="muted"></p></div></form></div><div class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Transparent by design.</h2><p class="muted">Inputs stay in this browser. No account or server is required.</p><div id="toolHelp" class="callout">Use realistic inputs and treat the result as a decision aid, not a promise.</div></div></div></div></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/utilities.js"></script><script src="../js/navigation.js"></script><script src="../js/main.js"></script><script src="../js/tools.js"></script><script src="../js/calculators.js"></script><script>wireSimple("simpleForm",()=>{const gross=val("team")*val("days")*val("hours"),eff=gross*val("focus")/100;setText("result",eff.toFixed(1)+" effective hrs");document.getElementById("explain").textContent=`Gross capacity: ${AO.fmt(gross)} hrs. Focus factor applied: ${val("focus")}%`;});</script><script src="../js/universe-pages.js"></script></body></html>
