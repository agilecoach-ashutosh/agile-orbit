<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Planning | Agile Orbit</title><meta name="description" content="Estimate a delivery range from scope and average throughput."><meta name="theme-color" content="#071019"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/universe-pages.css"></head><body><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../">Home</a><span>/</span><span>Tools</span></div><span class="eyebrow">TOOL</span><h1>Release Planning</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Estimate a delivery range from scope and average throughput.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><form id="simpleForm"><div class="form-grid"><div class="field"><label>Scope points</label><input id="scope" type="number" min="0" step="0.1" value="120"></div><div class="field"><label>Average velocity</label><input id="velocity" type="number" min="0" step="0.1" value="30"></div><div class="field"><label>Risk buffer %</label><input id="buffer" type="number" min="0" step="0.1" value="15"></div></div><div class="actions"><button class="btn btn-primary">Calculate</button><button type="button" class="btn btn-secondary" data-print>Print</button></div><div class="result" style="margin-top:18px"><small>Result</small><strong id="result">0</strong><p id="explain" class="muted"></p></div></form></div><div class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Transparent by design.</h2><p class="muted">Inputs stay in this browser. No account or server is required.</p><div id="toolHelp" class="callout">Use realistic inputs and treat the result as a decision aid, not a promise.</div></div></div></div></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/utilities.js"></script><script src="../js/navigation.js"></script><script src="../js/main.js"></script><script src="../js/tools.js"></script><script src="../js/calculators.js"></script><script>wireSimple("simpleForm",()=>{const scope=val("scope"),v=val("velocity");if(v<=0)throw Error();const base=scope/v,days=base*(1+val("buffer")/100);setText("result",days.toFixed(1)+" Sprint-equivalents");document.getElementById("explain").textContent=`Base estimate: ${base.toFixed(1)}. With buffer: ${days.toFixed(1)}.`;});</script><script src="../js/universe-pages.js"></script></body></html>
