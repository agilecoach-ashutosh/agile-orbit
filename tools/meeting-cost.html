<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Cost Calculator | Agile Orbit</title><meta name="description" content="Estimate the people-cost of a meeting."><meta name="theme-color" content="#071019"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/universe-pages.css"><link rel="stylesheet" href="../css/reference-nav.css"></head><body class="universe-inner"><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../">Home</a><span>/</span><span>Tools</span></div><span class="eyebrow">TOOL</span><h1>Meeting Cost Calculator</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Estimate the people-cost of a meeting.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><form id="simpleForm"><div class="form-grid"><div class="field"><label>People</label><input id="people" type="number" min="0" step="0.1" value="8"></div><div class="field"><label>Duration (minutes)</label><input id="duration" type="number" min="0" step="0.1" value="60"></div><div class="field"><label>Average hourly cost</label><input id="rate" type="number" min="0" step="0.1" value="1500"></div></div><div class="actions"><button class="btn btn-primary">Calculate</button><button type="button" class="btn btn-secondary" data-print>Print</button></div><div class="result" style="margin-top:18px"><small>Result</small><strong id="result">0</strong><p id="explain" class="muted"></p></div></form></div><div class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Transparent by design.</h2><p class="muted">Inputs stay in this browser. No account or server is required.</p><div id="toolHelp" class="callout">Use realistic inputs and treat the result as a decision aid, not a promise.</div></div></div></div></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/utilities.js"></script><script src="../js/navigation.js"></script><script src="../js/main.js"></script><script src="../js/tools.js"></script><script src="../js/calculators.js"></script><script>wireSimple("simpleForm",()=>{const cost=val("people")*(val("duration")/60)*val("rate");setText("result",AO.fmt(cost));document.getElementById("explain").textContent="Estimated people-cost = participants × meeting hours × average hourly cost.";});</script><script src="../js/universe-pages.js"></script></body></html>
