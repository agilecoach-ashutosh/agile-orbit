<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow Metrics Calculator | Agile Orbit</title><meta name="description" content="Explore cycle time, throughput and WIP."><meta name="theme-color" content="#071019"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/universe-pages.css"></head><body class="universe-page"><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../">Home</a><span>/</span><span>Tools</span></div><span class="eyebrow">TOOL</span><h1>Flow Metrics Calculator</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Explore cycle time, throughput and WIP.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><form id="simpleForm"><div class="form-grid"><div class="field"><label>Items completed</label><input id="throughput" type="number" min="0" step="0.1" value="30"></div><div class="field"><label>Days in period</label><input id="period" type="number" min="0" step="0.1" value="10"></div><div class="field"><label>Average WIP</label><input id="wip" type="number" min="0" step="0.1" value="12"></div></div><div class="actions"><button class="btn btn-primary">Calculate</button><button type="button" class="btn btn-secondary" data-print>Print</button></div><div class="result" style="margin-top:18px"><small>Result</small><strong id="result">0</strong><p id="explain" class="muted"></p></div></form></div><div class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Transparent by design.</h2><p class="muted">Inputs stay in this browser. No account or server is required.</p><div id="toolHelp" class="callout">Use realistic inputs and treat the result as a decision aid, not a promise.</div></div></div></div></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/utilities.js"></script><script src="../js/navigation.js"></script><script src="../js/main.js"></script><script src="../js/tools.js"></script><script src="../js/universe-pages.js"></script><script src="../js/calculators.js"></script><script>wireSimple("simpleForm",()=>{const t=val("throughput"),p=val("period"),w=val("wip");if(p<=0)throw Error();const thr=t/p,ct=w/thr;setText("result",ct.toFixed(2)+" days estimated cycle time");document.getElementById("explain").textContent=`Throughput: ${thr.toFixed(2)} items/day. Little’s Law gives WIP / throughput as an approximate cycle time when assumptions hold.`;});</script></body></html>
