n-height:320px;border:1px solid #ffffff1f;border-radius:16px;background:#fbfaf6;overflow:hidden}.v img{width:100%;height:320px;display:block;object-fit:contain}.expand{position:absolute;right:10px;bottom:10px;border:1px solid rgba(0,0,0,.14);background:rgba(5,12,23,.88);color:#fff;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer;font-size:.75rem}.d{display:grid;gap:11px}.box{padding:13px 14px;border-radius:14px;background:#ffffff09;border:1px solid #ffffff14}.box h3{font-size:.76rem;margin:0 0 6px;color:#7fdcf7;text-transform:uppercase;letter-spacing:.05em}.box p{margin:0;font-size:.88rem;line-height:1.55}.tip{border-color:rgba(105,240,176,.14);background:rgba(105,240,176,.035)}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #ffffff1f;background:#ffffff0d;color:inherit;font-size:1.4rem;cursor:pointer}.p{left:16px}.n{right:16px}.dots{display:flex;justify-content:center;gap:6px;margin-top:18px}.dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:#ffffff33;cursor:pointer}.dot.a{background:#fff}.lightbox{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lb-bg{position:absolute;inset:0;background:rgba(1,5,12,.9);backdrop-filter:blur(8px)}.lb-card{position:relative;z-index:2;width:min(1100px,96vw);max-height:92vh;padding:18px;border:1px solid rgba(255,255,255,.15);border-radius:20px;background:#0b1623}.lb-card img{width:100%;max-height:82vh;object-fit:contain;background:#fbfaf6;border-radius:13px;display:block}.lb-close{position:absolute;right:26px;top:26px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(5,12,23,.9);color:#fff;font-size:1.4rem;cursor:pointer}.back{display:inline-flex;margin-top:22px;color:#61d9ff;font-weight:700}@media(max-width:800px){.body{grid-template-columns:1fr}.stage{padding:22px 52px}.v,.v img{min-height:260px;height:260px}.slide-head{display:block}}@media(max-width:520px){.stage{padding:20px 44px}.v,.v img{min-height:220px;height:220px}.arrow{width:36px;height:36px}.p{left:6px}.n{right:6px}}</style></head><body class="universe-inner"><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/agile-orbit/">Home</a><span>/</span><a href="/agile-orbit/learn/facilitation/">Facilitation</a><span>/</span><span>Techniques</span></div><span class="eyebrow">FACILITATION · TOOLKIT</span><h1>Facilitation Techniques</h1><p class="muted" style="max-width:820px;font-size:1.08rem">Start with the purpose of the conversation. Then choose a technique that helps the group participate, explore, decide or align.</p></div></section><section class="section"><div class="container"><div class="x"><div class="purpose-nav" id="purpose"></div><div class="navs" id="nav"></div><div class="stage"><button class="arrow p" aria-label="Previous technique">‹</button><button class="arrow n" aria-label="Next technique">›</button><div id="slides" aria-live="polite"></div><div class="dots" id="dots"></div></div><a class="back" href="/agile-orbit/learn/facilitation/">← Back to Facilitation</a></div></div></section></main><div class="lightbox" id="lightbox" aria-hidden="true"><div class="lb-bg" data-close></div><div class="lb-card" role="dialog" aria-modal="true" aria-label="Expanded facilitation visual"><button class="lb-close" data-close aria-label="Close expanded visual">×</button><img id="lbimg" alt=""></div></div><div id="site-footer"></div><script src="/agile-orbit/js/navigation.js?v=20260908"></script><script src="/agile-orbit/js/config.js?v=20260908"></script><script src="/agile-orbit/js/utilities.js?v=20260908"></script><script src="/agile-orbit/js/main.js?v=20260908"></script><script src="/agile-orbit/js/tools.js?v=20260908"></script><script src="/agile-orbit/js/universe-pages.js?v=20260908"></script><script>const D=[
['Participation','🗣 CREATE PARTICIPATION','1-2-4-All','Get everyone’s thinking into the room before the loudest voice shapes the discussion.','01-1-2-4-All.png','12–15 min','4–100+','When participation is uneven, the topic is ambiguous, or you want to reduce groupthink before converging.','Ask one clear question. Give 1 minute alone, 2 minutes in pairs, about 4 minutes in groups of four, then harvest the most important ideas with the whole group.','We keep missing Sprint Goals. Before jumping to solutions, everyone writes what they think is really happening, compares in pairs and then builds a stronger shared view.','Do not skip the silent individual reflection. It protects independent thinking before social influence begins.'],
['Decide & Prioritize','🗳 QUICK CONSENT CHECK','Roman Voting','Quickly sense whether the group supports or objects to a clear proposal.','02-Roman-Voting.png','2–5 min','3–30','When a proposal is already understood and you need a fast yes/no consent signal before deciding whether deeper discussion is needed.','State the proposal clearly. Ask everyone to vote at the same time using the agreed thumb signal. If meaningful objections appear, explore them before re-checking.','Can we replace our manual release gate with automated checks? The vote reveals two objections worth understanding before proceeding.','Use Roman Voting for a quick consent signal. If you need to measure strength of agreement, use Fist of Five instead.'],
['Decide & Prioritize','🗳 CHOOSE A FEW','Dot Voting','Narrow a broad option set to the few items worth deeper discussion.','03-Dot-Voting.png','5–10 min','4–50','When you have many reasonable choices and need a manageable shortlist rather than a final decision by popularity alone.','Give each person a fixed number of votes. Place votes on the options they believe matter most, then take the highest-ranked items forward for discussion or decision.','A retrospective generates nine possible improvements. Each person gets three votes; the team explores the top three before committing.','Be explicit about whether dots create a shortlist or a final decision. Popularity can hide minority risks.'],
['Decide & Prioritize','🗳 TEST AGREEMENT','Fist of Five','Measure the strength of agreement on one proposal and quickly expose concerns.','04-Fist-of-Five.png','5–10 min','3–30','When the group needs to decide on one idea, experiment or approach and the degree of support matters.','Define what 1–5 means and the minimum threshold for moving forward. Everyone votes simultaneously. Invite low scores to explain concerns, adapt the proposal and vote again.','The team is considering a new on-call rotation. A spread from 2 to 5 reveals concerns that a simple yes/no vote would hide.','Ask low scorers for information, not justification. The purpose is to improve the proposal, not pressure people upward.'],
['Explore & Understand','💡 MAKE SENSE OF MANY IDEAS','Affinity Mapping','Turn a large pile of ideas into themes the group can understand and act on.','05-Affinity-Mapping.png','15–30 min','4–40','After brainstorming, retrospective data collection or interviews when there are too many individual observations to discuss one by one.','Use one idea per card. Let participants group similar ideas, name the clusters and then discuss the patterns and relationships between themes.','A retrospective produces 47 notes. The team groups them into five themes and discovers that most frustrations come from two underlying handoff problems.','Let clusters emerge before naming them. Premature labels can force ideas into the facilitator’s mental model.'],
['Participation','🗣 EXPLORE PERSPECTIVES','Gallery Walk','Let people inspect several ideas or outputs without one presenter dominating the conversation.','06-Gallery-Walk.png','15–30 min','6–60','When several people or groups have produced material that others need to inspect, compare and build on.','Place outputs around the room or virtual space. Give silent viewing time, invite comments or questions, then harvest patterns and surprises together.','Each squad maps its biggest delivery risk. People rotate through the boards silently before a cross-team discussion starts.','Silent viewing first gives people time to think instead of reacting to the presenter’s framing.'],
['Align & Collaborate','🤝 REFINE A LARGE SET','White Elephant','Sort and refine a large set of items while building shared understanding of the categories.','07-White-Elephant.png','20–40 min','5–25','When a group has a large unstructured collection of stories, issues or actions and needs to organize it collaboratively.','Create useful categories, place items visibly and let participants move, question, merge or discard them while explaining the reasoning.','A backlog has 60 quick wins. The team sorts them into clear, unclear, duplicate and discard, exposing different interpretations.','Use this only when collaborative sorting itself creates understanding; for simple theme-finding, Affinity Mapping is usually clearer.'],
['Explore & Understand','💡 DIVERGE THEN CONVERGE','Diverge → Converge','Prevent premature decisions by deliberately expanding possibilities before narrowing.','08-Diverge-Converge.png','20–45 min','4–30','When the first idea is becoming the default too early or the team needs alternatives before committing.','Separate the phases. First generate useful possibilities without evaluating. Then cluster, compare against explicit criteria and narrow to the most promising options.','The team wants another approval step to reduce release risk. Before agreeing, it generates alternative ways to reduce the same risk.','Announce the phase clearly. Critiquing ideas during divergence shuts down exploration; endless ideation during convergence prevents decisions.'],
['Explore & Understand','💡 CREATE HEALTHY CHALLENGE','TRIZ','Expose counterproductive behaviors by imagining how to guarantee the worst possible result.','09-TRIZ.png','25–35 min','4–30','When a team is stuck in “that’s just how we do it” thinking or needs a safe way to identify damaging patterns.','Ask how to reliably create the worst possible outcome. Then ask which of those behaviors are actually happening today, even partly. Finally decide what to stop doing and choose a first concrete step.','How could we guarantee refinement becomes a two-hour status meeting? The team laughs, then notices it already does three items from its own worst-practice list.','The power of TRIZ is recognizing what you already do—not merely flipping bad ideas into generic opposites.'],
['Align & Collaborate','🤝 CREATE SHARED EXPECTATIONS','Team Agreement','Make working expectations explicit instead of relying on assumptions.','10-Team-Agreement.png','30–60 min','3–20','At the start of a team relationship, after recurring friction, or when remote/hybrid behavior needs to be reset.','Ask what people need from one another for the team to work well. Cluster responses, convert them into a short set of observable behaviors and agree when to revisit them.','In retrospectives the same three people talk. The team agrees that everyone gets silent thinking time before open discussion.','Write observable behavior, not slogans. “Respect each other” is vague; “challenge ideas without interrupting people” can be inspected.'],
['Decide & Prioritize','🗳 DISTRIBUTE WEIGHTED CHOICE','Thirty-Five','Use repeated pairwise scoring to surface ideas that retain support across many conversations.','11-Thirty-Five.png','20–30 min','8–50','When many ideas seem important and you want distributed comparison rather than one plenary debate.','Each participant holds an idea card. In each of 7 rounds, pair up and distribute exactly 5 points between the two cards: 5–0, 4–1 or 3–2. Swap cards, find a new partner and repeat. After 7 rounds, total each card’s score; 35 is the maximum.','A group has many improvement ideas and no obvious winner. Repeated pairwise comparison reveals which ideas keep earning support across the room.','Explain that the score creates a priority signal, not unquestionable truth. Review surprising high and low results before acting.'],
['Decide & Prioritize','🗳 NEGOTIATE A SHARED PRIORITY','Buy a Feature','Turn prioritization into a negotiation where participants must make visible trade-offs with limited resources.','12-Buy-a-Feature.png','30–60 min','5–25','When stakeholders have different priorities and you want a collaborative conversation about value and trade-offs.','Give participants limited play money and price the options so nobody can buy everything alone. Let them negotiate, combine budgets and explain why an option deserves investment.','Product wants five features while engineering wants reliability work. Limited budget forces participants to discuss value and combine resources.','The learning is in the negotiation. Do not rush directly to the final purchases; listen for the value arguments and trade-offs.']];
let i=0,filter='All';const N=document.getElementById('nav'),S=document.getElementById('slides'),Z=document.getElementById('dots'),P=document.getElementById('purpose');const purposes=['All','Participation','Explore & Understand','Decide & Prioritize','Align & Collaborate'];function visible(){return D.map((d,k)=>({d,k})).filter(x=>filter==='All'||x.d[0]===filter)}function build(){P.innerHTML='';purposes.forEach(p=>{const b=document.createElement('button');b.className='purpose'+(p===filter?' a':'');b.textContent=(p==='All'?'✨ All':p==='Participation'?'🗣 Participation':p==='Explore & Understand'?'💡 Explore & Understand':p==='Decide & Prioritize'?'🗳 Decide & Prioritize':'🤝 Align & Collaborate');b.onclick=()=>{filter=p;i=0;build()};P.appendChild(b)});N.innerHTML='';S.innerHTML='';Z.innerHTML='';const V=visible();V.forEach((x,pos)=>{const d=x.d,k=x.k;const c=document.createElement('button');c.className='chip'+(!pos?' a':'');c.textContent=d[2];c.onclick=()=>show(pos);N.appendChild(c);const s=document.createElement('article');s.className='slide'+(!pos?' a':'');const img='/agile-orbit/assets/images/facilitation/'+d[4];s.innerHTML='<div class="slide-head"><div><div class="eyebrow">'+d[1]+' <span style="opacity:.6;margin-left:8px">'+(pos+1)+' / '+V.length+'</span></div><h2>'+d[2]+'</h2><p class="muted"><strong>Use it to:</strong> '+d[3]+'</p></div></div><div class="meta"><span>⏱ '+d[5]+'</span><span>👥 '+d[6]+'</span></div><div class="body"><div class="visual-wrap"><div class="v"><img loading="lazy" src="'+img+'" alt="Visual guide for '+d[2]+'"></div><button class="expand" data-img="'+img+'" data-alt="'+d[2]+' visual">🔍 View larger</button></div><div class="d"><div class="box"><h3>When to use</h3><p>'+d[7]+'</p></div><div class="box"><h3>How to run it</h3><p>'+d[8]+'</p></div><div class="box"><h3>Real team example</h3><p>'+d[9]+'</p></div><div class="box tip"><h3>Facilitator tip</h3><p>'+d[10]+'</p></div></div></div>';S.appendChild(s);const z=document.createElement('button');z.className='dot'+(!pos?' a':'');z.setAttribute('aria-label','Go to '+d[2]);z.onclick=()=>show(pos);Z.appendChild(z)});wireExpand()}function show(n){const V=visible();i=(n+V.length)%V.length;document.querySelectorAll('.slide').forEach((x,k)=>x.classList.toggle('a',k===i));document.querySelectorAll('.chip').forEach((x,k)=>{x.classList.toggle('a',k===i);x.setAttribute('aria-current',k===i?'true':'false')});document.querySelectorAll('.dot').forEach((x,k)=>x.classList.toggle('a',k===i))}document.querySelector('.p').onclick=()=>show(i-1);document.querySelector('.n').onclick=()=>show(i+1);const L=document.getElementById('lightbox'),LI=document.getElementById('lbimg');function wireExpand(){document.querySelectorAll('.expand').forEach(b=>b.onclick=()=>{LI.src=b.dataset.img;LI.alt=b.dataset.alt;L.classList.add('open');L.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';L.querySelector('.lb-close').focus()})}function closeLB(){L.classList.remove('open');L.setAttribute('aria-hidden','true');document.body.style.overflow=''}L.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeLB()});document.addEventListener('keydown',e=>{if(L.classList.contains('open')){if(e.key==='Escape')closeLB();return}if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});build();</script></body></html>
