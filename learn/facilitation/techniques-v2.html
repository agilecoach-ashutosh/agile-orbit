<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facilitation Techniques | Agile Orbit</title><link rel="icon" href="/agile-orbit/assets/icons/favicon.svg"><link rel="stylesheet" href="/agile-orbit/css/style.css?v=20260907"><link rel="stylesheet" href="/agile-orbit/css/components.css?v=20260907"><link rel="stylesheet" href="/agile-orbit/css/animations.css?v=20260907"><link rel="stylesheet" href="/agile-orbit/css/responsive.css?v=20260907"><link rel="stylesheet" href="/agile-orbit/css/universe-pages.css?v=20260907"><style>body{margin:0}.x{max-width:1080px;margin:auto}.v{min-height:320px;border:1px solid #ffffff1f;border-radius:16px;background:#fbfaf6;overflow:hidden}.v img{width:100%;height:320px;display:block;object-fit:contain}.stage{position:relative;background:linear-gradient(180deg,#101f30,#0b1623);border:1px solid #ffffff1a;border-radius:20px;padding:26px 74px;min-height:560px}.slide{display:none}.slide.a{display:block}.body{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}.d{display:grid;gap:14px}.box{padding:14px 15px;border-radius:14px;background:#ffffff09;border:1px solid #ffffff14}.box h3{font-size:.82rem;margin:0 0 6px}.box p{margin:0;font-size:.9rem;line-height:1.55}.navs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 auto 22px}.chip{border:1px solid #ffffff1f;background:#ffffff09;color:inherit;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.chip.a{background:#ffffff17}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #ffffff1f;background:#ffffff0d;color:inherit;font-size:1.4rem}.p{left:16px}.n{right:16px}.dots{display:flex;justify-content:center;gap:6px;margin-top:18px}.dot{width:7px;height:7px;border-radius:50%;background:#ffffff33}.dot.a{background:#fff}@media(max-width:800px){.body{grid-template-columns:1fr}.stage{padding:22px 54px}.v,.v img{min-height:260px;height:260px}}@media(max-width:520px){.stage{padding:20px 46px}.v,.v img{min-height:220px;height:220px}}</style></head><body class="universe-inner"><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/agile-orbit/">Home</a><span>/</span><a href="/agile-orbit/learn/facilitation/">Facilitation</a><span>/</span><span>Techniques</span></div><span class="eyebrow">FACILITATION · TOOLKIT</span><h1>Facilitation Techniques</h1><p class="muted" style="max-width:760px;font-size:1.08rem">A visual, practical guide to choosing the right technique for the situation — not just collecting a list of meeting games.</p></div></section><section class="section"><div class="container"><div class="x"><div class="navs" id="nav"></div><div class="stage"><button class="arrow p">‹</button><button class="arrow n">›</button><div id="slides"></div><div class="dots" id="dots"></div></div><a href="/agile-orbit/learn/facilitation/" style="display:inline-flex;margin-top:22px;color:#61d9ff;font-weight:700">← Back to Facilitation</a></div></div></section></main><script src="/agile-orbit/js/navigation.js?v=20260907"></script><script>const D=[['CREATE PARTICIPATION','1-2-4-All','get everyone\'s thinking into the room before the loudest voice shapes the discussion.','01-1-2-4-All.png','When participation is uneven, the topic is ambiguous, or you want to reduce groupthink before converging.','Frame one clear question. Give quiet individual reflection first, then pairs, then groups of four, then ask each group to share one important idea.','We keep missing Sprint Goals. Before jumping to solutions, everyone gets a minute to write what they think is really happening.'],['BUILD CONSENSUS','Roman Voting','quickly sense where the group stands when several people have already explored the options.','02-Roman-Voting.png','When you want a fast read of the room without turning the decision into a long debate.','State the proposal clearly. Give everyone a private or visible rating on the agreed scale. Explore the spread, especially the low scores, then re-check.','Can we move our release gate to automated checks?'],['CHOOSE A FEW','Dot Voting','narrow a broad option set to the few items worth deeper discussion.','03-Dot-Voting.png','When you have many reasonable choices and need to select a manageable shortlist.','Give each person a fixed number of votes. Place votes on the options they believe matter most, then take the highest-ranked items forward.','We found nine possible improvement actions. Each person gets three votes; the team discusses the top three.'],['DECIDE ON ONE PROPOSAL','Fist of Five','test the strength of agreement on one proposal and expose concerns quickly.','04-Fist-of-Five.png','When the team needs to decide on a single idea, approach, experiment, or improvement action.','Define what each score means and what minimum agreement is needed. Everyone votes at the same time. Discuss low scores and vote again.','Should we stop carrying unfinished stories into the next Sprint?'],['MAKE SENSE OF MANY IDEAS','Affinity Mapping','turn a large pile of ideas into themes the group can understand and act on.','05-Affinity-Mapping.png','After brainstorming, retrospective data collection, interview notes, or any moment when you have more ideas than you can discuss individually.','Write one idea per card. Ask people to group similar ideas, name the clusters, then discuss the themes rather than every individual card.','We have 47 retro notes. Instead of debating all 47, the team groups them into five themes.'],['EXPLORE PERSPECTIVES','Gallery Walk','let people inspect ideas at their own pace, making different perspectives visible before the group discusses them.','06-Gallery-Walk.png','When several people or groups have produced material that others need to inspect without one presenter dominating.','Place outputs around the room or virtual space. Give people silent viewing time, then invite questions, observations, and patterns.','Each squad maps its biggest delivery risk on a board.'],['REFINE A LARGE SET','White Elephant','sort and refine a large set of items while building shared understanding of the categories.','07-White-Elephant.png','When the group has a big unstructured set of ideas, stories, issues, or actions and needs to make sense of it together.','Create meaningful columns, place items visibly, and have participants move, question, and refine them.','Our backlog has 60 quick wins. The team sorts them into clear, unclear, duplicate, and discard.'],['OPEN OPTIONS, THEN NARROW','Diverge → Converge','avoid premature decisions by deliberately expanding options before choosing a path.','08-Diverge-Converge.png','When the first idea is getting locked in too early or the team needs alternatives before committing.','First maximize useful possibilities without evaluating. Then cluster, test, compare, and narrow using explicit criteria.','The team wants to add another approval step. Before agreeing, they generate other ways to reduce risk.'],['CREATE HEALTHY CHALLENGE','TRIZ','challenge existing habits by first asking how you could make the problem spectacularly worse.','09-TRIZ.png','When a team is stuck in that’s just how we do it thinking or needs a safe way to expose harmful patterns.','Ask for the worst possible practices. Capture them without defending or judging. Then flip each one into its opposite: what would prevent or reverse it?','How could we guarantee our refinement becomes a two-hour status meeting every week?'],['CREATE SHARED EXPECTATIONS','Team Agreement','make the team\'s working rules explicit instead of relying on assumptions.','10-Team-Agreement.png','At the start of a team relationship, after recurring friction, or when remote/hybrid behaviour needs to be reset.','Ask what do we need from each other for this team to work well? Cluster responses, agree on a short set of observable behaviours, and revisit them.','In retros, the same three people talk. The team agrees on a simple rule: everyone gets thinking time before open discussion.'],['DISTRIBUTE WEIGHTED CHOICE','Thirty-Five','let the group repeatedly compare ideas and distribute a fixed pool of points, making it harder for one voice to dominate.','11-Thirty-Five.png','When many ideas seem important and you want a structured way to compare them repeatedly across the group.','Each person starts with a preferred idea. People work in pairs, distribute seven points, swap partners, repeat for five rounds, then total the scores to 35.','We have six product ideas and no obvious winner.'],['NEGOTIATE A SHARED PRIORITY','Buy a Feature','turn prioritisation into a negotiation where participants must combine limited resources rather than simply state preferences.','12-Buy-a-Feature.png','When stakeholders have different priorities and you need a collaborative conversation about trade-offs.','Give participants limited play money. Price the options so nobody can buy everything alone. Let them negotiate and pool money.','Product wants five features; engineering wants reliability work. The budget forces trade-offs.']];let i=0;const N=document.getElementById('nav'),S=document.getElementById('slides'),Z=document.getElementById('dots');D.forEach((d,k)=>{const c=document.createElement('button');c.className='chip'+(!k?' a':'');c.textContent=d[1];c.onclick=()=>show(k);N.appendChild(c);const s=document.createElement('article');s.className='slide'+(!k?' a':'');s.innerHTML='<div class="eyebrow">'+d[0]+' <span style="opacity:.6;margin-left:8px">'+(k+1)+' / 12</span></div><h2>'+d[1]+'</h2><p class="muted"><strong>Use it to:</strong> '+d[2]+'</p><div class="body"><div class="v"><img src="/agile-orbit/assets/images/facilitation/'+d[3]+'" alt="Cartoon visual for '+d[1]+'" onerror="this.onerror=null;this.src=\'https://raw.githubusercontent.com/agilecoach-ashutosh/agile-orbit/main/assets/images/facilitation/'+d[3]+'\'"></div><div class="d"><div class="box"><h3>When to use</h3><p>'+d[4]+'</p></div><div class="box"><h3>How to use</h3><p>'+d[5]+'</p></div><div class="box"><h3>Real situation</h3><p>“'+d[6]+'”</p></div></div></div>';S.appendChild(s);const z=document.createElement('span');z.className='dot'+(!k?' a':'');z.onclick=()=>show(k);Z.appendChild(z)});function show(n){i=(n+12)%12;document.querySelectorAll('.slide').forEach((x,k)=>x.classList.toggle('a',k===i));document.querySelectorAll('.chip').forEach((x,k)=>x.classList.toggle('a',k===i));document.querySelectorAll('.dot').forEach((x,k)=>x.classList.toggle('a',k===i))}document.querySelector('.p').onclick=()=>show(i-1);document.querySelector('.n').onclick=()=>show(i+1);</script></body></html>
