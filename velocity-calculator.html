<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velocity Calculator | Agile Orbit</title><meta name="description" content="Calculate average velocity from completed Sprints."><meta name="theme-color" content="#071019"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/universe-pages.css"></head><body class="universe-page"><div id="site-nav"></div><div id="mobile-drawer" class="mobile-drawer"></div><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="../">Home</a><span>/</span><span>Tools</span></div><span class="eyebrow">TOOL</span><h1>Velocity Calculator</h1><p class="muted" style="max-width:760px;font-size:1.08rem">Calculate average velocity from completed Sprints.</p></div></section><section class="section"><div class="container"><div class="tool-layout"><div class="panel"><form id="simpleForm"><div class="form-grid"><div class="field"><label>Sprint 1 points</label><input id="v1" type="number" min="0" step="0.1" value="28"></div><div class="field"><label>Sprint 2 points</label><input id="v2" type="number" min="0" step="0.1" value="32"></div><div class="field"><label>Sprint 3 points</label><input id="v3" type="number" min="0" step="0.1" value="30"></div><div class="field"><label>Sprint 4 points</label><input id="v4" type="number" min="0" step="0.1" value="34"></div></div><div class="actions"><button class="btn btn-primary">Calculate</button><button type="button" class="btn btn-secondary" data-print>Print</button></div><div class="result" style="margin-top:18px"><small>Result</small><strong id="result">0</strong><p id="explain" class="muted"></p></div></form></div><div class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Transparent by design.</h2><p class="muted">Inputs stay in this browser. No account or server is required.</p><div id="toolHelp" class="callout">Use realistic inputs and treat the result as a decision aid, not a promise.</div></div></div></div></section></main><div id="site-footer"></div><script src="../js/config.js"></script><script src="../js/utilities.js"></script><script src="../js/navigation.js"></script><script src="../js/main.js"></script><script src="../js/tools.js"></script><script src="../js/universe-pages.js"></script><script src="../js/calculators.js"></script><script>wireSimple("simpleForm",()=>{const a=["v1","v2","v3","v4"].map(id=>Math.max(0,val(id)));const avg=a.reduce((x,y)=>x+y,0)/a.length;setText("result",avg.toFixed(1)+" points/Sprint");document.getElementById("explain").textContent="Average of the four entered Sprint velocities.";});</script></body></html>
